<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave — Mise</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A22; --ink-60:#5B6B60; --ink-30:#9AA79E; --ink-08:#E4E8E2;
    --bg:#F6F4EE; --white:#FFFFFF; --green:#3D5240; --ember:#B7653B;
    --amber:#B7791F; --amber-bg:#FEF6E7; --red:#C0392B; --red-bg:#FBEBE9; --green-bg:#EAF0EA;
    --font:'Inter',sans-serif; --font-d:'DM Serif Display',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);padding:22px 16px;max-width:820px;margin:0 auto}
  .back{display:inline-block;color:var(--green);text-decoration:none;font-size:13px;margin-bottom:14px}
  .title{font-family:var(--font-d);font-size:30px;margin-bottom:2px}
  .sub{color:var(--ink-60);font-size:14px;margin-bottom:18px}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .pill{border:1px solid var(--ink-08);background:var(--white);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--ink-60);cursor:pointer;font-family:var(--font)}
  .pill.active{background:var(--green);color:#fff;border-color:var(--green)}
  select,.search{height:38px;border:1px solid var(--ink-08);border-radius:10px;padding:0 12px;font-size:13px;font-family:var(--font);color:var(--ink);background:var(--white);outline:none}
  .search{flex:1;min-width:160px}
  .count{font-size:12px;color:var(--ink-30);margin-bottom:10px}
  .card{background:var(--white);border:1px solid var(--ink-08);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
  .av{width:38px;height:38px;flex-shrink:0;border-radius:10px;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
  .body{flex:1;min-width:0}
  .name{font-weight:600;font-size:14px}
  .meta{font-size:12.5px;color:var(--ink-60);margin-top:2px}
  .reason{font-size:12px;color:var(--ink-30);margin-top:4px;font-style:italic}
  .badge{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px;display:inline-block;margin-top:6px}
  .b-pending{background:var(--amber-bg);color:var(--amber)}
  .b-approved{background:var(--green-bg);color:var(--green)}
  .b-rejected{background:var(--red-bg);color:var(--red)}
  .reviewed{font-size:11px;color:var(--ink-30);margin-top:4px}
  .actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  .btn{border:none;border-radius:9px;height:32px;padding:0 14px;font-size:12.5px;font-weight:600;font-family:var(--font);cursor:pointer}
  .b-ok{background:var(--green);color:#fff}
  .b-no{background:var(--red-bg);color:var(--red);border:1px solid rgba(192,57,43,.2)}
  .empty{text-align:center;color:var(--ink-30);padding:40px 0;font-size:14px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <a class="back" href="/dashboard">← Dashboard</a>
  <div class="title">Leave</div>
  <div class="sub">Review, approve, and track leave applications. <a href="/leave-import" style="color:var(--green)">Import balances from Excel →</a></div>

  <div class="filters">
    <button class="pill active" data-status="all" onclick="setStatus(this)">All</button>
    <button class="pill" data-status="pending" onclick="setStatus(this)">Pending</button>
    <button class="pill" data-status="approved" onclick="setStatus(this)">Approved</button>
    <button class="pill" data-status="rejected" onclick="setStatus(this)">Rejected</button>
    <select id="yearSel" onchange="loadLeave()"></select>
    <input type="text" class="search" id="search" placeholder="Search name…" oninput="render()">
    <button id="exportBtn" class="pill" style="border-color:var(--green);color:var(--green);font-weight:600" onclick="exportReport()">Export report</button>
    <button id="recalcBtn" class="pill" style="border-color:var(--ember);color:var(--ember);font-weight:600" onclick="recalcBalances()">Recalculate balances</button>
    <button id="addLeaveBtn" class="pill" style="background:var(--green);border-color:var(--green);color:#fff;font-weight:600" onclick="openAddLeave()">+ Add leave</button>
  </div>

  <div id="addModal" style="display:none;position:fixed;inset:0;background:rgba(30,42,34,.5);z-index:999;align-items:center;justify-content:center;padding:20px">
    <div style="background:var(--white);border-radius:16px;max-width:440px;width:100%;padding:22px;max-height:90vh;overflow:auto">
      <div style="font-family:var(--font-d);font-size:22px;margin-bottom:4px">Add leave for staff</div>
      <div style="font-size:12.5px;color:var(--ink-60);margin-bottom:16px">Manager entry — bypasses the 3-week notice rule. Created as pending for you to approve below.</div>
      <label style="font-size:12px;color:var(--ink-60);font-weight:600">Staff</label>
      <select id="alStaff" style="width:100%;margin:4px 0 12px"></select>
      <label style="font-size:12px;color:var(--ink-60);font-weight:600">Leave type</label>
      <select id="alType" style="width:100%;margin:4px 0 12px"></select>
      <div style="display:flex;gap:10px">
        <div style="flex:1"><label style="font-size:12px;color:var(--ink-60);font-weight:600">From</label><input type="date" id="alFrom" style="width:100%;margin-top:4px;height:38px;border:1px solid var(--ink-08);border-radius:10px;padding:0 12px;font-family:var(--font);color:var(--ink);background:var(--white)"></div>
        <div style="flex:1"><label style="font-size:12px;color:var(--ink-60);font-weight:600">To</label><input type="date" id="alTo" style="width:100%;margin-top:4px;height:38px;border:1px solid var(--ink-08);border-radius:10px;padding:0 12px;font-family:var(--font);color:var(--ink);background:var(--white)"></div>
      </div>
      <label style="font-size:12px;color:var(--ink-60);font-weight:600;margin-top:12px;display:block">Reason</label>
      <textarea id="alReason" rows="2" style="width:100%;margin:4px 0 8px;border:1px solid var(--ink-08);border-radius:10px;padding:8px 12px;font-family:var(--font);resize:vertical"></textarea>
      <div id="alMsg" style="font-size:12.5px;margin:4px 0;min-height:16px"></div>
      <div style="display:flex;gap:10px;margin-top:8px">
        <button class="btn b-ok" style="flex:1" onclick="submitAddLeave()">Add leave</button>
        <button class="pill" style="flex:1" onclick="closeAddLeave()">Cancel</button>
      </div>
    </div>
  </div>
  <div class="count" id="count"></div>
  <div id="list"></div>

<script>
let all = [], status = 'all';
const yearSel = document.getElementById('yearSel');
const nowYear = new Date().getFullYear();
for (let y = nowYear; y >= nowYear - 2; y--) { const o=document.createElement('option'); o.value=y; o.textContent=y; yearSel.appendChild(o); }

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(d){ return d ? new Date(d).toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'}) : ''; }
function setStatus(el){ document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active')); el.classList.add('active'); status=el.dataset.status; render(); }

async function loadLeave(){
  try{
    const r = await fetch('/api/leave/applications?year=' + yearSel.value);
    all = r.ok ? await r.json() : [];
  }catch(e){ all=[]; }
  render();
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let rows = all.slice();
  if (status !== 'all') rows = rows.filter(a => a.status === status);
  if (q) rows = rows.filter(a => (a.staff_name||'').toLowerCase().includes(q));
  document.getElementById('count').textContent = rows.length + (rows.length===1?' application':' applications');
  const list = document.getElementById('list');
  if (!rows.length){ list.innerHTML = '<div class="empty">No leave applications' + (status!=='all'?(' ('+status+')'):'') + '.</div>'; return; }
  list.innerHTML = rows.map(a => {
    const initials = (a.staff_name||'?').split(' ').map(w=>w[0]).slice(0,2).join('');
    const range = a.start_date === a.end_date ? fmt(a.start_date) : fmt(a.start_date) + ' – ' + fmt(a.end_date);
    const badge = '<span class="badge b-'+a.status+'">'+a.status+'</span>';
    const reviewed = a.reviewed_by ? '<div class="reviewed">'+ (a.status==='approved'?'Approved':'Rejected') +' by '+esc(a.reviewed_by)+'</div>' : '';
    const reject = a.reject_reason ? '<div class="reason">Reason: '+esc(a.reject_reason)+'</div>' : '';
    const reason = a.reason ? '<div class="reason">"'+esc(a.reason)+'"</div>' : '';
    const doc = a.has_attachment ? '<div style="margin-top:6px"><a href="/api/leave/'+a.id+'/attachment" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;color:var(--green);text-decoration:none">📎 View document</a></div>' : '';
    const actions = a.status==='pending'
      ? '<div class="actions"><button class="btn b-ok" onclick="review('+a.id+',\'approved\')">Approve</button><button class="btn b-no" onclick="review('+a.id+',\'rejected\')">Reject</button></div>'
      : '';
    return '<div class="card">'+
      '<div class="av">'+esc(initials)+'</div>'+
      '<div class="body">'+
        '<div class="name">'+esc(a.staff_name||'')+'</div>'+
        '<div class="meta">'+esc(a.leave_type||'')+' · '+range+' · '+a.days+(a.days===1?' day':' days')+'</div>'+
        reason + doc + badge + reviewed + reject +
      '</div>'+ actions +
    '</div>';
  }).join('');
}

async function review(id, newStatus){
  let reject_reason = null;
  if (newStatus === 'rejected'){ reject_reason = prompt('Reason for rejection (optional):'); if (reject_reason === null) return; }
  try{
    const d = await fetch('/api/leave/'+id+'/review', {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ status:newStatus, reject_reason })
    }).then(r=>r.json());
    if (d.success){ await loadLeave(); }
    else alert(d.error || 'Could not update this application.');
  }catch(e){ alert('Network error — please try again.'); }
}

// ── Add leave for a staff member (manager override — bypasses 21-day rule) ────
const LEAVE_TYPES = ['Annual Leave','Medical Leave','Hospitalisation Leave','Compassionate Leave','Childcare Leave','Maternity Leave','Paternity Leave','Off in Lieu','Unpaid Leave'];
async function openAddLeave(){
  const sel = document.getElementById('alStaff');
  if (!sel.dataset.loaded){
    try {
      const staff = await fetch('/api/staff').then(r=>r.json());
      (staff||[]).filter(s=>s.is_active!==0).sort((a,b)=>(a.name||'').localeCompare(b.name||''))
        .forEach(s=>{ const o=document.createElement('option'); o.value=s.id; o.textContent=s.name+' ('+s.staff_type+')'; sel.appendChild(o); });
      const ts=document.getElementById('alType'); LEAVE_TYPES.forEach(t=>{ const o=document.createElement('option'); o.value=t; o.textContent=t; ts.appendChild(o); });
      sel.dataset.loaded='1';
    } catch(e){}
  }
  document.getElementById('alMsg').textContent='';
  document.getElementById('addModal').style.display='flex';
}
function closeAddLeave(){ document.getElementById('addModal').style.display='none'; }
async function submitAddLeave(){
  const staffId=document.getElementById('alStaff').value, leave_type=document.getElementById('alType').value;
  const from=document.getElementById('alFrom').value, to=document.getElementById('alTo').value;
  const reason=document.getElementById('alReason').value.trim();
  const msg=document.getElementById('alMsg');
  if(!staffId||!leave_type||!from||!to){ msg.style.color='var(--red)'; msg.textContent='Please fill staff, type and both dates.'; return; }
  if(to<from){ msg.style.color='var(--red)'; msg.textContent='End date is before start date.'; return; }
  try{
    const d=await fetch('/api/leave/apply',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({staffId,leave_type,start_date:from,end_date:to,reason})}).then(r=>r.json());
    if(d.success){ msg.style.color='var(--green)'; msg.textContent='Added — '+d.days+' day(s). Approve it in the list below.';
      document.getElementById('alFrom').value=''; document.getElementById('alTo').value=''; document.getElementById('alReason').value='';
      setTimeout(()=>{ closeAddLeave(); loadLeave(); }, 1000); }
    else { msg.style.color='var(--red)'; msg.textContent=d.error||'Could not add leave.'; }
  }catch(e){ msg.style.color='var(--red)'; msg.textContent='Network error — please try again.'; }
}

// ── Recalculate used-day balances from approved applications ──────────────────
async function recalcBalances(){
  const year = yearSel.value;
  if (!confirm('Recalculate every staff member’s used leave for '+year+' from their approved applications (counting leave from 29 Jul '+year+' onward, to match the imported balances)?\n\nThis overwrites the current used-day counts and fixes any drift from import/approval order. Totals are not changed.')) return;
  const btn = document.getElementById('recalcBtn');
  if (btn){ btn.disabled = true; btn.textContent = 'Recalculating…'; }
  try {
    const d = await fetch('/api/leave/entitlements/recalc', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ year })
    }).then(r=>r.json());
    if (d.success) alert('Done — recalculated '+d.groups+' balance line(s) for '+d.year+', counting approved leave from '+d.since+' onward.');
    else alert(d.error || 'Could not recalculate.');
  } catch(e){ alert('Network error — please try again.'); }
  finally { if (btn){ btn.disabled=false; btn.textContent='Recalculate balances'; } }
}

// ── Export per-staff leave transaction report (active full-timers only) ────────
async function exportReport(){
  const btn = document.getElementById('exportBtn');
  const year = yearSel.value;
  if (btn){ btn.disabled = true; btn.textContent = 'Building…'; }
  try {
    const staff = await fetch('/api/staff').then(r=>r.json());
    const ft = (staff||[]).filter(s => s.staff_type==='fulltime' && s.is_active!==0)
                          .sort((a,b)=> (a.name||'').localeCompare(b.name||''));
    if (!ft.length){ alert('No active full-time staff to export.'); return; }

    const apps = await fetch('/api/leave/applications?year='+year).then(r=>r.ok?r.json():[]);
    const byStaff = {};
    (apps||[]).forEach(a=>{ (byStaff[a.staff_id] = byStaff[a.staff_id] || []).push(a); });

    const prText = { citizen:'Citizen (SG)', pr:'Permanent Resident', foreigner:'Foreigner' };
    const wb = XLSX.utils.book_new();
    const usedNames = {};

    for (const s of ft){
      let bals = [];
      try { bals = await fetch('/api/leave/balances?staffId='+s.id+'&year='+year).then(r=>r.ok?r.json():[]); } catch(e){ bals=[]; }

      const rows = [];
      rows.push(['Employee Information']);
      rows.push(['Employee ID', s.id]);
      rows.push(['Employee Name', s.name]);
      rows.push(['Role', s.role]);
      rows.push(['Employment Type', 'Full-time']);
      rows.push(['Residency', prText[s.pr_status] || s.pr_status || '']);
      rows.push(['Join Date', '(not tracked in Mise)']);
      rows.push(['Confirmation Date', '(not tracked in Mise)']);
      rows.push(['Resign Date', '']);
      rows.push([]);

      rows.push(['Leave Balance  (as at '+new Date().toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'})+')']);
      rows.push(['Leave Type','Period Start','Period End','Total Entitlement','Taken','Balance']);
      (bals||[]).slice().sort((a,b)=> (a.leave_type||'').localeCompare(b.leave_type||''))
        .forEach(b=> rows.push([b.leave_type, '01 Jan '+year, '31 Dec '+year, b.total_days, b.used_days, b.remaining]));
      rows.push([]);

      rows.push(['Leave Applications']);
      rows.push(['Amount Taken','Leave Type','Date Applied','Start Date','End Date','Status','Reason','Reviewed By','Reviewed At']);
      const list = (byStaff[s.id] || []).slice().sort((a,b)=> (a.start_date||'').localeCompare(b.start_date||''));
      if (!list.length) rows.push(['(no applications for '+year+')']);
      list.forEach(a=> rows.push([a.days, a.leave_type, fmt(a.created_at), a.start_date, a.end_date, a.status,
                                  a.reason||'', a.reviewed_by||'', fmt(a.reviewed_at)]));

      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [{wch:16},{wch:18},{wch:14},{wch:12},{wch:12},{wch:12},{wch:30},{wch:16},{wch:14}];

      let nm = (s.name || ('Staff '+s.id)).replace(/[\\\/\?\*\[\]:]/g,' ').trim().slice(0,28) || ('Staff '+s.id);
      let base = nm, n = 2;
      while (usedNames[nm.toLowerCase()]){ nm = base.slice(0,26)+' '+(n++); }
      usedNames[nm.toLowerCase()] = 1;
      XLSX.utils.book_append_sheet(wb, ws, nm);
    }
    XLSX.writeFile(wb, 'Mise_Leave_Report_'+year+'.xlsx');
  } catch(e){ alert('Could not build the report: '+(e.message||e)); }
  finally { if (btn){ btn.disabled=false; btn.textContent='Export report'; } }
}

loadLeave();
</script>
</body>
</html>
